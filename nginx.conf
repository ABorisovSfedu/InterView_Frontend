server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Обработка SPA маршрутов
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Кэширование статических ресурсов
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API проксирование на бэкенд
    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept application/json;
        proxy_cache_bypass $http_upgrade;
        
        # Сохраняем заголовки ответа от бэкенда
        proxy_pass_header Content-Type;
        proxy_hide_header X-Powered-By;
        
        # Таймауты
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Отключение буферизации для немедленной передачи ответов
        proxy_buffering off;
        
        # Обработка ошибок проксирования - возвращаем JSON вместо HTML
        proxy_intercept_errors on;
        error_page 502 503 504 = @backend_error;
    }
    
    # Обработчик ошибок бэкенда - возвращает JSON
    location @backend_error {
        default_type application/json;
        return 502 '{"error":"Сервер временно недоступен","status":502}';
    }

    # Gzip сжатие
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;
}

